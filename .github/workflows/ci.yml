name: Conformance lab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Every step here targets loopback demo hosts only; refuse any remote target outright.
      FLOW_CONFORMANCE_LOOPBACK_ONLY: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-06
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run format:check
      - run: npm test
      - name: Generate reproducible demonstration evidence
        run: npm run demo
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: conformance-evidence
          path: runs/
          if-no-files-found: warn
          retention-days: 7
